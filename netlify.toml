# Static site, no build step. Netlify publishes only site/, so the README,
# CLAUDE.md and tests in this repo are never served.
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
