# Static site, no build step. Netlify serves this folder as it is.
[build]
  publish = "."
  command = ""

# Repo notes are not part of the public site.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
